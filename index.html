<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tatame">
<meta name="description" content="Diário de treino de jiu-jitsu: sessões, sparring, técnicas, faixa, peso e lesões.">
<meta name="theme-color" content="#0A0D12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Tatame — diário de jiu-jitsu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{
  --bg:#F4F6F9;--surface:#FFFFFF;--surface2:#EBEFF5;--ink:#121820;--muted:#5F6B7A;--line:#E2E7EE;
  --win:#1C8F5E;--loss:#D2452F;--warn:#9C6410;--accent:#1F6BFF;--on-accent:#FFFFFF;--scrim:rgba(8,12,18,.45);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0D12;--surface:#141A21;--surface2:#1C232C;--ink:#EEF2F7;--muted:#8B97A6;--line:#232B35;
    --win:#3FD07E;--loss:#FF6B5A;--warn:#F0B44B;--accent:#2F7BFF;--scrim:rgba(0,0,0,.65);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0D12;--surface:#141A21;--surface2:#1C232C;--ink:#EEF2F7;--muted:#8B97A6;--line:#232B35;
  --win:#3FD07E;--loss:#FF6B5A;--warn:#F0B44B;--accent:#2F7BFF;--scrim:rgba(0,0,0,.65);color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.cond{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;letter-spacing:.005em}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:18px 18px 130px}
.muted{color:var(--muted)}
.small{font-size:14px}
h2{font-size:30px;line-height:1.1;margin:30px 0 10px}
h2:first-child{margin-top:6px}
h3{font-size:20px;margin:22px 0 4px}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.nav-in{max-width:560px;margin:0 auto;display:flex}
.nav button{flex:1;background:none;border:0;color:var(--muted);padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;font-size:12px}
.nav button[aria-current=page]{color:var(--accent)}
.nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.btn{border:1.5px solid var(--ink);background:transparent;border-radius:10px;padding:12px 16px;font-weight:600;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:15px}
.btn.danger{border-color:var(--loss);color:var(--loss)}
.btn.armed{background:var(--loss);color:#fff;border-color:var(--loss)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.btns .btn{flex:1;white-space:nowrap}
.fab{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom,0px));right:calc(max(0px,(100% - 560px)/2) + 18px);background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:0 22px;height:52px;font-weight:600;font-size:17px;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:15}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500;font-size:15px;white-space:nowrap;min-height:38px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seg2{display:flex;background:var(--surface);border-radius:10px;padding:4px;gap:4px;margin:4px 0 6px}
.seg2 button{flex:1;border:0;background:none;border-radius:8px;padding:9px 0;font-weight:600;color:var(--muted)}
.seg2 button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}

.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.rowbtn{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;padding:13px 0;display:flex;gap:14px;align-items:center}
.date{width:46px;text-align:center;flex:none}
.date b{display:block;font:600 30px/1 'Barlow Condensed','Arial Narrow',sans-serif}
.date span{font-size:13px;color:var(--muted)}
.hour{width:58px;flex:none;font:600 22px/1 'Barlow Condensed','Arial Narrow',sans-serif}
.grow{flex:1;min-width:0}
.title{font-weight:600}
.pill{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600;white-space:nowrap;color:var(--muted)}
.pill.s-treinando{border-color:var(--accent);color:var(--accent)}
.pill.s-afiada{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pill.l-ativa{border-color:var(--loss);color:var(--loss)}
.pill.l-recuperando{border-color:var(--warn);color:var(--warn)}
.pill.l-curada{border-color:var(--win);color:var(--win)}
.tname{flex:1;min-width:0;background:none;border:0;text-align:left;padding:2px 0;font-weight:500}
.tname small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.star{background:none;border:0;font-size:24px;color:var(--line);width:40px;height:40px;line-height:1}
.star[aria-pressed=true]{color:var(--accent)}
.empty{padding:26px 0;color:var(--muted)}
.res-sub{color:var(--win);font-weight:600}.res-tap{color:var(--loss);font-weight:600}
.alert{background:var(--surface);border-left:5px solid var(--loss);border-radius:12px;padding:12px 14px;margin:10px 0}
.alert.ok{border-left-color:var(--accent)}

.belt{display:block;width:100%;height:auto}
.hero{display:block;width:100%;background:none;border:0;text-align:left;padding:0}
.hero .belt{margin:6px 0 10px}
.hero-t{font:600 44px/1 'Barlow Condensed','Arial Narrow',sans-serif}
.hero-s{color:var(--muted);margin-top:4px}

.big{font:700 64px/1 'Barlow Condensed','Arial Narrow',sans-serif}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.day{border:1.5px solid var(--line);border-radius:8px;padding:6px 0 8px;text-align:center;min-height:62px;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.day span{font-size:13px;color:var(--muted)}
.day b{font:600 15px 'Barlow Condensed','Arial Narrow',sans-serif}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.day.on span{color:var(--on-accent);opacity:.85}
.day.plan{border-style:dashed;border-color:var(--accent)}
.day.today{border-width:2.5px;border-color:var(--ink);border-style:solid}
.day.fut{opacity:.55}

.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0}
.stat{background:var(--surface);border-radius:10px;padding:12px}
.stat b{display:block;font:700 34px/1 'Barlow Condensed','Arial Narrow',sans-serif}
.stat span{font-size:13px;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:8px;height:120px;position:relative;margin-top:8px}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:center}
.chart .bar{width:100%;background:color-mix(in srgb,var(--accent) 35%,transparent);border-radius:4px 4px 0 0;min-height:2px}
.chart .bar.hit{background:var(--accent)}
.chart .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);pointer-events:none}
.xl{display:flex;gap:8px;margin-top:4px}.xl span{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.seg{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line);margin:8px 0}
.seg i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.legend b{font-weight:600}
.hbar{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:15px}
.hbar .lab{width:92px;flex:none}
.hbar .tr{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--accent)}
.hbar .n{width:34px;text-align:right;color:var(--muted)}
.prog{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:5px}
.meta{padding:14px 0;border-bottom:1px solid var(--line)}
.meta:last-child{border-bottom:0}
.step{display:flex;align-items:center;gap:10px}
.step button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ink);background:none;font-size:22px;line-height:1}
.step b{min-width:38px;text-align:center;font:600 24px 'Barlow Condensed','Arial Narrow',sans-serif}
.review{background:var(--surface);border-radius:12px;padding:14px 16px;border-left:5px solid var(--accent);width:100%;text-align:left;border-top:0;border-right:0;border-bottom:0;color:inherit;font:inherit}
.wchart{width:100%;height:auto;display:block;margin-top:6px;overflow:visible}
.wchart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.wchart .dot{fill:var(--accent)}
.wchart .tg{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 5}
.wchart text{font:12px 'Barlow',sans-serif;fill:var(--muted)}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92vh;background:var(--bg);border-radius:18px 18px 0 0;z-index:31;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px}
.sheet-head h2{margin:0;font-size:28px}
.xbtn{background:var(--surface);border:0;border-radius:50%;width:38px;height:38px;font-size:18px;flex:none}
.sheet-body{overflow-y:auto;padding:4px 18px calc(24px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.lbl{display:block;font-weight:600;margin:18px 0 6px}
.inp{width:100%;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;min-height:46px}
.inp.short{width:120px}
textarea.inp{min-height:96px;resize:vertical}
.inline{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rpe button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;height:46px;font:600 20px 'Barlow Condensed','Arial Narrow',sans-serif}
.rpe button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.round{background:var(--surface);border-radius:12px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.round .chips{grid-column:1 / 2}
.round .chip{padding:5px 11px;font-size:14px;min-height:34px}
.pk{display:flex;width:100%;text-align:left;align-items:center;gap:12px;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0}
.pk i{width:24px;height:24px;border:1.5px solid var(--muted);border-radius:6px;flex:none;display:grid;place-items:center;font-style:normal;font-size:15px;line-height:1}
.pk[aria-pressed=true] i{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pk[aria-pressed=true] i::after{content:"✓"}
.sticky{position:sticky;top:0;background:var(--bg);padding:6px 0 8px;z-index:2}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.gal figure{position:relative;margin:0;background:var(--surface);border-radius:10px;overflow:hidden}
.gal img,.gal video{width:100%;height:118px;object-fit:cover;display:block;background:#000}
.gal .del{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:50%;width:30px;height:30px;line-height:1}
.filebtn{display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--ink);border-radius:10px;padding:12px 16px;font-weight:600;min-height:46px;flex:1}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}

.tm{border-radius:16px;padding:22px 12px;text-align:center;background:var(--surface);margin:8px 0 14px}
.tm.work{background:var(--accent);color:var(--on-accent)}
.tm.prep{background:#E3A31A;color:#241800}
.tm.rest{background:var(--surface2)}
.tm-ph{font:600 26px 'Barlow Condensed','Arial Narrow',sans-serif}
.tm-time{font:700 112px/1 'Barlow Condensed','Arial Narrow',sans-serif;font-variant-numeric:tabular-nums}
@media (max-width:380px){.tm-time{font-size:92px}}
.cfg{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
#warn{position:fixed;left:18px;right:18px;bottom:calc(24px + env(safe-area-inset-bottom,0px));max-width:524px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;z-index:50;font-weight:500}

/* ---- camada visual v3 ---- */
.wrap{padding-top:4px}
.bar{position:sticky;top:0;z-index:18;background:var(--bg);border-bottom:1px solid transparent}
.bar.stuck{border-bottom-color:var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:12px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{font:600 24px/1 'Barlow Condensed','Arial Narrow',sans-serif;display:flex;align-items:baseline;gap:9px}
.mark small{font-family:'Barlow',sans-serif;font-size:14px;font-weight:500;color:var(--muted)}
.bchip{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:999px;padding:4px 11px 4px 7px;font-size:14px;font-weight:600;background:var(--surface)}
.bchip i{width:16px;height:16px;border-radius:4px;display:block;border:1px solid rgba(128,128,128,.5)}
.card{background:var(--surface);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(16,21,28,.07)}
.hero{padding:16px;background:var(--surface);border-radius:14px;box-shadow:0 1px 2px rgba(16,21,28,.07)}
.hero .belt{margin:2px 0 12px}
.hero-t{font-size:38px}
h3{display:flex;align-items:center;gap:10px;color:var(--ink)}
h3::after{content:"";flex:1;height:1px;background:var(--line)}
.score{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.score .big{color:var(--accent)}
.stat b{color:var(--accent)}
.nav .ico{width:44px;height:28px;border-radius:999px;display:grid;place-items:center;transition:background .15s}
.nav button[aria-current=page] .ico{background:color-mix(in srgb,var(--accent) 16%,transparent)}
a.chip{text-decoration:none;display:inline-flex;align-items:center}
.alert{box-shadow:0 1px 2px rgba(16,21,28,.07)}
.week{gap:7px}
.day{border-radius:10px}
.rowbtn:last-of-type{border-bottom:0}
.sheet{box-shadow:0 -8px 30px rgba(0,0,0,.25)}


/* ---- refino v4: mais limpo, mais arredondado ---- */
:root{--shadow:0 1px 3px rgba(16,21,28,.055)}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]){--shadow:none}}
:root[data-theme=dark]{--shadow:none}
.wrap{padding:2px 16px 134px}
.bar-in{padding:11px 16px 9px}
.mark{font-size:22px}
.bchip{border:0;background:var(--surface2);padding:5px 12px 5px 8px;font-weight:600}
h2{font-size:27px;margin:26px 0 12px}
h3{font-size:16px;font-weight:600;color:var(--muted);margin:24px 0 10px}
h3::after{opacity:.55}
.card,.hero,.stat,.review,.alert,.posfig{border-radius:18px;box-shadow:var(--shadow)}
.hero{padding:18px}
.alert{border-left-width:4px;padding:14px 16px}
.row,.rowbtn{border-bottom:0;background:var(--surface);border-radius:15px;padding:13px 15px;margin-bottom:8px;box-shadow:var(--shadow)}
.rowbtn{width:100%}
.meta,.cfg{border-bottom:0;background:var(--surface);border-radius:16px;padding:15px;margin-bottom:8px;box-shadow:var(--shadow)}
.stat{padding:15px 14px;border-radius:17px}
.stats3{gap:8px}
.stat span{font-size:12.5px;margin-top:2px;display:block}
.inp{border-radius:14px;border-width:1px;box-shadow:var(--shadow)}
.btn{border-radius:14px;border-width:1.5px}
.btn.primary{box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 26%,transparent)}
.chip{border-width:1px;box-shadow:var(--shadow)}
.seg2{border-radius:14px;box-shadow:var(--shadow)}
.seg2 button{border-radius:11px}
.filebtn{border-radius:14px;border-width:1.5px}
.day{border-radius:13px;border-width:1px;background:var(--surface);box-shadow:var(--shadow)}
.day.today{border-width:2px}
.week{gap:6px}
.sheet{border-radius:26px 26px 0 0}
.sheet-head{padding:18px 18px 8px}
.xbtn{background:var(--surface2)}
.fab{border-radius:18px;height:54px;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 34%,transparent)}
.nav{background:var(--surface)}
.nav .ico{width:48px;height:30px}
.nav button{font-size:11.5px;padding:9px 0 7px;gap:3px}
.nav svg{width:22px;height:22px;stroke-width:1.9}
.round{border-radius:15px;padding:12px;box-shadow:var(--shadow)}
.pk{border-bottom:1px solid var(--line);padding:12px 2px}
.prog,.seg{border-radius:7px}
.empty{text-align:center;padding:30px 10px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow)}
.gal figure{border-radius:14px}
.tm{border-radius:20px}
#warn{border-radius:14px}


/* ---- v5: referência escura ---- */
.bar{background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.4) blur(12px)}
.bar-in{padding:12px 16px 10px;align-items:center}
.who{display:flex;align-items:center;gap:11px;background:none;border:0;padding:0;text-align:left;min-width:0}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font:600 19px 'Barlow Condensed',sans-serif;background:color-mix(in srgb,var(--accent) 22%,var(--surface));color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.who-t{display:flex;flex-direction:column;min-width:0}
.who-t b{font-size:15.5px;line-height:1.25}
.who-t small{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.bdot{width:9px;height:9px;border-radius:3px;display:inline-block;border:1px solid rgba(128,128,128,.45)}
.icobtn{width:38px;height:38px;border-radius:12px;border:0;background:var(--surface);color:var(--muted);display:grid;place-items:center;flex:none}
.icobtn svg{width:20px;height:20px}
.welcome{font-size:30px;margin:14px 0 8px}
.stat{background:var(--surface);border-radius:16px;padding:14px 12px;text-align:left}
.stat b{font-size:30px;color:var(--ink)}
.stat span{font-size:11.5px;line-height:1.3;color:var(--muted)}
.card{padding:16px}
.plano .hd{align-items:flex-start}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;padding:2px 0}
.pl-row{display:flex;align-items:center;gap:12px;padding:9px 0}
.pl-row+.pl-row{border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.pl-d{width:34px;flex:none;font-weight:600;font-size:13.5px;color:var(--muted);text-transform:capitalize}
.pl-row.hoje .pl-d{color:var(--accent)}
.pl-t{flex:1;min-width:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tick{width:24px;height:24px;border-radius:50%;flex:none;border:1.6px solid var(--line);display:grid;place-items:center}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick svg{width:15px;height:15px;fill:none;stroke:var(--on-accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.beltcard{margin-top:6px}
.prog{height:8px;background:var(--surface2)}
.mono{width:44px;height:44px;flex:none;border-radius:13px;background:var(--surface2);color:var(--muted);display:grid;place-items:center;font:600 15px 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.03em}
.row,.rowbtn{gap:12px;box-shadow:none;background:var(--surface)}
.card,.hero,.alert,.stat,.empty,.meta,.cfg,.round,.inp,.chip,.seg2,.day{box-shadow:none}
.chip{background:var(--surface2);border-color:transparent}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}
.inp{background:var(--surface);border-color:var(--line)}
.btn{border-width:1.5px;border-color:var(--line);color:var(--ink)}
.btn.primary{border-color:var(--accent)}
.btn.danger{border-color:color-mix(in srgb,var(--loss) 55%,transparent);color:var(--loss)}
.nav{background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px)}
.alert{background:var(--surface);border-left:0;padding:14px 16px;border-radius:16px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--loss)}
.alert.ok::before{background:var(--accent)}
.hbar .tr{background:var(--surface2)}
.date b{color:var(--ink)}
.fab{box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 40%,transparent)}
h3{margin:26px 0 10px}
.empty{background:var(--surface)}


/* ---- fundo ---- */
#bg{position:fixed;inset:0;z-index:-2;pointer-events:none;background-size:cover;background-position:center}
#bg.tex{background-size:64px 64px;background-repeat:repeat;opacity:.075}
#bg.foto{opacity:1}
#bg.foto::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 90%,transparent) 0%,color-mix(in srgb,var(--bg) 74%,transparent) 30%,color-mix(in srgb,var(--bg) 66%,transparent) 62%,color-mix(in srgb,var(--bg) 80%,transparent) 100%)}
#bg.brilho{opacity:1;background:radial-gradient(80% 48% at 18% 0%,color-mix(in srgb,var(--accent) 26%,transparent) 0%,transparent 62%),radial-gradient(70% 42% at 95% 12%,color-mix(in srgb,var(--accent) 14%,transparent) 0%,transparent 60%)}
body{background:var(--bg)}
.bar{background:color-mix(in srgb,var(--bg) 82%,transparent)}
.bgopt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.bgopt button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;height:62px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden;position:relative}
.bgopt button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.bgopt .sw{width:100%;height:24px;border-radius:7px;background:var(--surface2)}


/* ---- nutrição ---- */
.hidro-in{display:flex;align-items:center;gap:16px}
.ring{width:104px;height:104px;flex:none}
.ring .rbg{fill:none;stroke:var(--surface2);stroke-width:9}
.ring .rfg{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .35s ease}
.ring .rt{fill:var(--ink);font:600 20px 'Barlow Condensed','Arial Narrow',sans-serif;text-anchor:middle}
.ring .rs{fill:var(--muted);font:400 11px 'Barlow',sans-serif;text-anchor:middle}
.hidro .chip{padding:6px 12px;min-height:34px;font-size:14px}
.pk .grow{min-width:0}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

const plural=(n,a,b)=>n===1?a:b;

const kg=n=>n.toFixed(1).replace('.',',')+' kg';

function tempoTxt(since){
  const d=Math.max(0,daysAgo(since));
  if(d<31)return `${d} ${plural(d,'dia','dias')}`;
  const mo=Math.floor(d/30.44),y=Math.floor(mo/12),m=mo%12,p=[];
  if(y)p.push(`${y} ${plural(y,'ano','anos')}`);
  if(m)p.push(`${m} ${plural(m,'mês','meses')}`);
  return p.join(' e ')||'1 mês';
}
function warn(msg){
  let el=document.getElementById('warn');
  if(!el){el=document.createElement('div');el.id='warn';el.setAttribute('role','alert');document.body.appendChild(el)}
  el.textContent=msg;el.hidden=false;clearTimeout(warn.t);warn.t=setTimeout(()=>{el.hidden=true},3200);
}

function defaults(){return{v:2,setup:false,tema:'dark',nome:'',fundo:'dojo',
  belt:{cor:'branca',graus:0,desde:today(),ultima:today()},hist:[],sessoes:[],
  tecnicas:SEED.map(([n,c],i)=>({id:'t'+i,nome:n,cat:c,status:'aprender',nota:'',fav:false,custom:false,midia:[],links:[]})),
  plano:[],peso:[],lesoes:[],nutri:{agua:{},ref:[],metas:{agua:'',kcal:'',prot:''},perfil:{sexo:'',idade:'',altura:'',ativ:'mod'}},
  metas:{semana:3,horas:12,pesoAlvo:'',extras:[]}}}
let memo=null;
function migrate(s){
  const d=defaults(),o=Object.assign(d,s,{metas:Object.assign(d.metas,s.metas||{}),belt:Object.assign(d.belt,s.belt||{})});
  ['hist','sessoes','tecnicas','plano','peso','lesoes'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=d[k]});
  o.nutri=Object.assign(d.nutri,o.nutri||{});
  o.nutri.metas=Object.assign(d.nutri.metas,o.nutri.metas||{});
  o.nutri.perfil=Object.assign(d.nutri.perfil,o.nutri.perfil||{});
  if(!Array.isArray(o.nutri.ref))o.nutri.ref=[];
  if(typeof o.nutri.agua!=='object'||!o.nutri.agua)o.nutri.agua={};
  if(!Array.isArray(o.metas.extras))o.metas.extras=[];
  o.tecnicas.forEach(t=>{if(!Array.isArray(t.midia))t.midia=[];if(!Array.isArray(t.links))t.links=[]});
  o.v=2;return o;
}
function load(){
  let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
  if(!raw&&memo)raw=memo;
  if(!raw)return defaults();
  try{return migrate(JSON.parse(raw))}catch(e){return defaults()}
}
let S=load();
function save(){const j=JSON.stringify(S);memo=j;try{localStorage.setItem(KEY,j)}catch(e){warn('Não foi possível salvar: armazenamento cheio ou bloqueado.')}}

/* ===== mídia (IndexedDB) ===== */
let dbp=null;
function db(){
  dbp=dbp||new Promise((res,rej)=>{
    let r;try{r=indexedDB.open('tatame-midia',1)}catch(e){return rej(e)}
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('m'))r.result.createObjectStore('m')};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
  return dbp;
}
function mput(id,blob){return db().then(d=>new Promise((res,rej)=>{const t=d.transaction('m','readwrite');t.objectStore('m').put(blob,id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)}))}
function mget(id){return db().then(d=>new Promise((res,rej)=>{const r=d.transaction('m','readonly').objectStore('m').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)}))}
function mdel(id){return db().then(d=>new Promise(res=>{const t=d.transaction('m','readwrite');t.objectStore('m').delete(id);t.oncomplete=()=>res();t.onerror=()=>res()}))}
const murl={};
function freeUrls(){Object.keys(murl).forEach(k=>{try{URL.revokeObjectURL(murl[k])}catch(e){}delete murl[k]})}
async function preload(list){
  for(const m of list||[]){
    if(murl[m.id])continue;
    try{const b=await mget(m.id);if(b)murl[m.id]=URL.createObjectURL(b)}catch(e){}
  }
}

/* ===== cálculos ===== */
const sorted=()=>[...S.sessoes].sort((a,b)=>b.data.localeCompare(a.data)||(b.t||0)-(a.t||0));
function weekMap(){const m={};S.sessoes.forEach(s=>{const k=iso(weekStart(parse(s.data)));m[k]=(m[k]||0)+1});return m}
function streak(){
  const m=weekMap(),goal=S.metas.semana;let d=weekStart(new Date()),n=0;
  if((m[iso(d)]||0)>=goal)n++;
  for(let i=0;i<520;i++){d.setDate(d.getDate()-7);if((m[iso(d)]||0)>=goal)n++;else break}
  return n;
}
function monthMin(){const p=today().slice(0,7);return S.sessoes.filter(s=>s.data.startsWith(p)).reduce((a,s)=>a+(+s.min||0),0)}
function trainedCount(){const m={};S.sessoes.forEach(s=>(s.tecnicas||[]).forEach(id=>m[id]=(m[id]||0)+1));return m}
function lastTrained(id){let l='';S.sessoes.forEach(s=>{if((s.tecnicas||[]).includes(id)&&s.data>l)l=s.data});return l}
const techName=id=>{const t=S.tecnicas.find(x=>x.id===id);return t?t.nome:null};
const planoDia=w=>S.plano.filter(p=>p.wd===w).sort((a,b)=>a.hora.localeCompare(b.hora));
const lesoesAtivas=()=>S.lesoes.filter(l=>l.status!=='curada');
const pesoOrd=()=>[...S.peso].sort((a,b)=>a.data.localeCompare(b.data));
function roundsSummary(rs){
  if(!rs||!rs.length)return '';
  const c={sub:0,tap:0,emp:0,flow:0};rs.forEach(r=>c[r.r]++);
  const p=[`${rs.length} ${plural(rs.length,'round','rounds')}`];
  if(c.sub)p.push(`<span class="res-sub">${c.sub} ${plural(c.sub,'finalização','finalizações')}</span>`);
  if(c.tap)p.push(`<span class="res-tap">${c.tap} ${plural(c.tap,'finalizado','finalizado')}</span>`);
  return p.join(' · ');
}
function proximoTreino(){
  if(!S.plano.length)return null;
  const now=new Date(),hm=pad(now.getHours())+':'+pad(now.getMinutes());
  for(let i=0;i<8;i++){
    const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i),w=idxWd(d);
    const list=planoDia(w).filter(p=>i>0||p.hora>=hm);
    if(list.length)return{p:list[0],dias:i,data:iso(d)};
  }
  return null;
}


/* ===== nutrição ===== */
const pesoAtual=()=>{const p=pesoOrd();return p.length?p[p.length-1].kg:null};
const minDia=k=>S.sessoes.filter(x=>x.data===k).reduce((a,x)=>a+(+x.min||0),0);
function metaAgua(k){
  const m=num(S.nutri.metas.agua);if(isFinite(m)&&m>0)return Math.round(m);
  const kg=pesoAtual()||75;
  return Math.round((kg*35+minDia(k)/60*600)/50)*50;
}
function metaKcal(){
  const m=num(S.nutri.metas.kcal);if(isFinite(m)&&m>0)return Math.round(m);
  const pf=S.nutri.perfil,kg=pesoAtual(),al=num(pf.altura),id=num(pf.idade);
  if(!kg||!isFinite(al)||!isFinite(id)||!pf.sexo)return null;
  const tmb=10*kg+6.25*al-5*id+(pf.sexo==='f'?-161:5);
  const f=(ATIV.find(a=>a[0]===pf.ativ)||ATIV[1])[2];
  return Math.round(tmb*f/10)*10;
}
function metaProt(){
  const m=num(S.nutri.metas.prot);if(isFinite(m)&&m>0)return Math.round(m);
  const kg=pesoAtual();return kg?Math.round(kg*1.8):null;
}
const agua=k=>+(S.nutri.agua[k]||0);
function diaRef(k){return S.nutri.ref.filter(r=>r.data===k)}
function totDia(k){
  return diaRef(k).reduce((a,r)=>({kcal:a.kcal+(+r.kcal||0),p:a.p+(+r.p||0),c:a.c+(+r.c||0),g:a.g+(+r.g||0)}),{kcal:0,p:0,c:0,g:0});
}
const ml=v=>v>=1000?(v/1000).toFixed(v%1000?1:0).replace('.',',')+' L':v+' ml';
function ring(pct,label,sub){
  const R=42,C=2*M_PI*R,off=C*(1-Math.min(1,pct));
  return `<svg class="ring" viewBox="0 0 110 110" role="img" aria-label="${esc(label)} de ${esc(sub)}">
    <circle cx="55" cy="55" r="${R}" class="rbg"/>
    <circle cx="55" cy="55" r="${R}" class="rfg" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 55 55)"/>
    <text x="55" y="52" class="rt">${esc(label)}</text><text x="55" y="68" class="rs">${esc(sub)}</text></svg>`;
}
const M_PI=Math.PI;

function diarioHtml(){
  const list=sorted();
  if(!list.length)return `<p class="empty">Seu diário está vazio. Toque em “Treino” para registrar a primeira aula, com técnicas e rounds de sparring.</p>`;
  let html='',cur='';
  list.forEach(s=>{
    const d=parse(s.data),m=d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    if(m!==cur){cur=m;html+=`<h3 style="text-transform:capitalize">${m}</h3>`}

function wchart(){
  const p=pesoOrd().slice(-14);
  if(p.length<2)return `<p class="empty">Registre ao menos duas pesagens para ver a curva.</p>`;
  const W=360,H=120,P=16,vals=p.map(x=>x.kg),alvo=num(S.metas.pesoAlvo);
  let mn=Math.min(...vals),mx=Math.max(...vals);
  if(isFinite(alvo)){mn=Math.min(mn,alvo);mx=Math.max(mx,alvo)}
  if(mx-mn<1){mn-=.5;mx+=.5}
  const x=i=>P+i*(W-2*P)/(p.length-1),y=v=>H-P-(v-mn)/(mx-mn)*(H-2*P);
  const pts=p.map((d,i)=>`${x(i).toFixed(1)},${y(d.kg).toFixed(1)}`).join(' ');
  const tg=isFinite(alvo)?`<line class="tg" x1="${P}" y1="${y(alvo).toFixed(1)}" x2="${W-P}" y2="${y(alvo).toFixed(1)}"/>`:'';
  return `<svg class="wchart" viewBox="0 0 ${W} ${H+18}" role="img" aria-label="Variação de peso nas últimas ${p.length} pesagens">
    ${tg}<polyline class="ln" points="${pts}"/>${p.map((d,i)=>`<circle class="dot" cx="${x(i).toFixed(1)}" cy="${y(d.kg).toFixed(1)}" r="3"/>`).join('')}
    <text x="${P}" y="${H+14}">${fmtDay(p[0].data)}</text><text x="${W-P}" y="${H+14}" text-anchor="end">${fmtDay(p[p.length-1].data)}</text>
  </svg><div class="muted small">Entre ${kg(mn)} e ${kg(mx)}${isFinite(alvo)?` · linha tracejada: alvo de ${kg(alvo)}`:''}</div>`;
}

/* ===== cronômetro ===== */
const T={cfg:{work:300,rest:60,rounds:5},ph:'idle',round:1,remain:0,run:false,end:0,iv:null,wl:null};
let ac=null;
function beep(f,d){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();
    o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.3,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d)}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(d>.3?300:80)}catch(e){}
}
const tmFmt=s=>pad(Math.floor(s/60))+':'+pad(s%60);
const PH={idle:'Pronto',prep:'Prepare-se',work:'Luta',rest:'Descanso',done:'Treino concluído'};
async function wake(on){try{if(on){T.wl=await navigator.wakeLock.request('screen')}else if(T.wl){await T.wl.release();T.wl=null}}catch(e){}}
function tmPaint(){
  const box=$('#tm-box');if(!box)return;
  box.className='tm '+(T.ph==='idle'||T.ph==='done'?'':T.ph);
  $('#tm-time').textContent=tmFmt(T.ph==='idle'?T.cfg.work:T.remain);
  $('#tm-ph').textContent=PH[T.ph];
  $('#tm-round').textContent=T.ph==='idle'?`${T.cfg.rounds} ${plural(T.cfg.rounds,'round','rounds')}`:`Round ${Math.min(T.round,T.cfg.rounds)} de ${T.cfg.rounds}`;
}
function tmTick(){
  const r=Math.ceil((T.end-Date.now())/1000);
  if(r!==T.remain){T.remain=Math.max(r,0);if((T.ph==='work'||T.ph==='prep')&&r>0&&r<=3)beep(660,.08)}
  if(r<=0){tmNext();return}
  tmPaint();
}
function tmNext(){
  if(T.ph==='prep'){T.ph='work';T.remain=T.cfg.work;beep(1000,.45)}
  else if(T.ph==='work'){
    if(T.round>=T.cfg.rounds){T.ph='done';T.run=false;clearInterval(T.iv);wake(false);beep(520,.9);refreshSheet();tmPaint();return}
    T.ph='rest';T.remain=T.cfg.rest;beep(520,.6);
  }else if(T.ph==='rest'){T.round++;T.ph='work';T.remain=T.cfg.work;beep(1000,.45)}
  T.end=Date.now()+T.remain*1000;tmPaint();
}
function tmToggle(){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  if(T.run){T.run=false;clearInterval(T.iv);wake(false);refreshSheet();tmPaint();return}
  if(T.ph==='idle'){T.ph='prep';T.round=1;T.remain=10}
  T.run=true;T.end=Date.now()+T.remain*1000;clearInterval(T.iv);T.iv=setInterval(tmTick,200);wake(true);refreshSheet();tmPaint();
}
function tmReset(){clearInterval(T.iv);T.run=false;T.ph='idle';T.round=1;T.remain=0;wake(false);if(sheet&&sheet.kind==='timer'){refreshSheet();tmPaint()}}
function timerForm(){
  const idle=T.ph==='idle',done=T.ph==='done';
  return `<div class="tm ${idle||done?'':T.ph}" id="tm-box" role="timer"><div class="tm-ph" id="tm-ph">${PH[T.ph]}</div><div class="tm-time" id="tm-time">${tmFmt(idle?T.cfg.work:T.remain)}</div><div id="tm-round" class="cond" style="font-size:22px">${idle?`${T.cfg.rounds} ${plural(T.cfg.rounds,'round','rounds')}`:`Round ${Math.min(T.round,T.cfg.rounds)} de ${T.cfg.rounds}`}</div></div>
  <div class="btns">${done?`<button class="btn primary" data-act="tm-log">Registrar este treino</button>`:`<button class="btn primary" data-act="tm-toggle">${T.run?'Pausar':(idle?'Iniciar':'Continuar')}</button>`}<button class="btn" data-act="tm-reset">Zerar</button></div>
  ${idle?`<div class="cfg"><div><div class="title">Tempo de luta</div><div class="muted small">por round</div></div><div class="step"><button data-act="tm-cfg" data-k="work" data-d="-30" aria-label="Diminuir">−</button><b>${tmFmt(T.cfg.work)}</b><button data-act="tm-cfg" data-k="work" data-d="30" aria-label="Aumentar">+</button></div></div>
  <div class="cfg"><div><div class="title">Descanso</div><div class="muted small">entre rounds</div></div><div class="step"><button data-act="tm-cfg" data-k="rest" data-d="-15" aria-label="Diminuir">−</button><b>${tmFmt(T.cfg.rest)}</b><button data-act="tm-cfg" data-k="rest" data-d="15" aria-label="Aumentar">+</button></div></div>
  <div class="cfg"><div><div class="title">Rounds</div></div><div class="step"><button data-act="tm-cfg" data-k="rounds" data-d="-1" aria-label="Diminuir">−</button><b>${T.cfg.rounds}</b><button data-act="tm-cfg" data-k="rounds" data-d="1" aria-label="Aumentar">+</button></div></div>`:''}`;
}

    if(i>=0)S.lesoes[i]=rec;else S.lesoes.push(rec);
    save();closeSheet();
  },
  'le-del'(t){twice(t,()=>{S.lesoes=S.lesoes.filter(l=>l.id!==LE.id);save();closeSheet()})},
  'belt-edit':()=>openBelt(false),
  'bd-cor'(t){BD.cor=t.dataset.v;if(BD.graus>maxGraus(BD.cor))BD.graus=maxGraus(BD.cor);refreshSheet()},
  'bd-graus'(t){BD.graus=+t.dataset.v;refreshSheet()},
  'bd-save'(){
    const first=!S.setup;
    S.nome=(BD.nome||'').trim();
    S.belt={cor:BD.cor,graus:BD.graus,desde:BD.desde||today(),ultima:first||!S.belt.ultima||S.belt.ultima<(BD.desde||'')?(BD.desde||today()):S.belt.ultima};
    S.setup=true;save();closeSheet();
  },
  'grad-open':openGrad,
  'gd-tipo'(t){GD.tipo=t.dataset.v;refreshSheet()},
  'gd-save'(){
    const b=S.belt,d=GD.data||today();
    if(GD.tipo==='grau'){b.graus++;b.ultima=d;S.hist.push({cor:b.cor,graus:b.graus,data:d,tipo:'grau'})}
    else{const nx=BELTS[BELTS.findIndex(x=>x[0]===b.cor)+1];b.cor=nx[0];b.graus=0;b.desde=d;b.ultima=d;S.hist.push({cor:b.cor,graus:0,data:d,tipo:'faixa'})}
    save();closeSheet();
  },
  'meta-step'(t){const k=t.dataset.k,lim=k==='semana'?[1,14]:[1,200];S.metas[k]=Math.max(lim[0],Math.min(lim[1],S.metas[k]+ +t.dataset.d));save();render()},
  'meta-inc'(t){const m=S.metas.extras.find(x=>x.id===t.dataset.id);m.atual=Math.max(0,m.atual+ +t.dataset.d);save();render()},
  'meta-del'(t){twice(t,()=>{S.metas.extras=S.metas.extras.filter(x=>x.id!==t.dataset.id);save();render()})},
  'meta-new':openNewMeta,
  'mg-save'(){const a=Math.round(+MG.alvo),n=(MG.t||'').trim();if(!n||!(a>0)){warn('Informe o nome da meta e quantas vezes.');return}
    S.metas.extras.push({id:uid(),t:n,alvo:a,atual:0});save();closeSheet()},
  tema(t){S.tema=t.dataset.v;save();render()},
  fundo(t){S.fundo=t.dataset.v;save();render()},
  install:openInstall,
  async 'inst-go'(){
    if(!deferred){warn('Use o menu do navegador para instalar.');return}
    deferred.prompt();try{await deferred.userChoice}catch(e){}
    deferred=null;closeSheet();
  },
  'backup-open':openBackup,
  'bk-file'(){
    const ok=dl(`tatame-${today()}.json`,JSON.stringify(S));
    $('#bk-msg').textContent=ok?'Arquivo gerado. Verifique os downloads.':'Não foi possível baixar aqui. Use “Copiar texto”.';
  },
  'bk-copy'(){
    const ta=$('#bk-out'),msg=$('#bk-msg');ta.select();
    const ok=()=>{msg.textContent='Dados copiados.'};
    try{navigator.clipboard.writeText(ta.value).then(ok,()=>{document.execCommand('copy');ok()})}catch(e){try{document.execCommand('copy');ok()}catch(_){msg.textContent='Não foi possível copiar. Selecione o texto e copie manualmente.'}}
  },
  'bk-import'(t){importData(BK,t)},
  'timer-open':openTimer,
  'tm-toggle':tmToggle,
  'tm-reset':tmReset,
  'tm-cfg'(t){const k=t.dataset.k,d=+t.dataset.d,lim={work:[30,1800],rest:[0,600],rounds:[1,20]}[k];T.cfg[k]=Math.max(lim[0],Math.min(lim[1],T.cfg[k]+d));refreshSheet()},
  'tm-log'(){const c=T.cfg,min=Math.round((c.work*c.rounds+c.rest*(c.rounds-1))/60);tmReset();sheet=null;const d=newDraft();d.min=String(min);openLog(d)}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f)f(t,e)});
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(d.bind){
    const[o,k]=d.bind.split('.');
    if(o==='BK'){BK=t.value;return}
    const map={L:()=>L,BD:()=>BD,GD:()=>GD,NT:()=>NT,MG:()=>MG,PL:()=>PL,PS:()=>PS,LE:()=>LE,AL:()=>AL,LK:()=>LK,RF:()=>RF,MN:()=>MN};
    const obj=map[o]&&map[o]();if(obj)obj[k]=t.value;
    if(o==='RF'&&k==='g'){const c=rfCalc(),box=t.closest('.card');
      if(box&&c)box.querySelector('.muted.small').innerHTML=`${Math.round(c.kcal)} kcal · ${c.p.toFixed(1).replace('.',',')} g proteína · ${c.c.toFixed(1).replace('.',',')} g carboidrato · ${c.gor.toFixed(1).replace('.',',')} g gordura`}
    return;
  }
  if(d.rp!==undefined){L.rounds[+d.rp].p=t.value;return}
  if(d.q==='tec'){ui.q=t.value;$('#tec-list').innerHTML=tecList();return}
  if(d.q==='pick'){pickQ=t.value;$('#pick-list').innerHTML=pickList();return}
  if(d.q==='alim'){ui.qa=t.value;const el=$('#alim-list');if(el)el.innerHTML=alimList();return}
  if(d.tnota){const x=S.tecnicas.find(y=>y.id===d.tnota);if(x){x.nota=t.value;save()}}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.midAdd){
    const id=t.dataset.midAdd,x=S.tecnicas.find(y=>y.id===id),files=[...t.files||[]];t.value='';
    if(!x||!files.length)return;
    let n=0;
    for(const f of files){
      if(f.size>80*1024*1024){warn(`${f.name} é grande demais (limite de 80 MB).`);continue}
      const mid=uid(),tipo=f.type.startsWith('video')?'vid':'img';
      try{await mput(mid,f);x.midia.push({id:mid,tipo,nome:f.name});murl[mid]=URL.createObjectURL(f);n++}
      catch(err){warn('Não foi possível guardar '+f.name)}
    }
    if(n){save();refreshSheet()}
    return;
  }
  if(t.dataset.bgfile){
    const f=t.files&&t.files[0];t.value='';if(!f)return;
    if(f.size>12*1024*1024){warn('Escolha uma imagem de até 12 MB.');return}
    try{
      await mput('bg:img',f);
      if(bgUrl)URL.revokeObjectURL(bgUrl);
      bgUrl=URL.createObjectURL(f);S.fundo='foto';save();render();
    }catch(err){warn('Não foi possível guardar a imagem.')}
    return;
  }
  if(t.dataset.bkfile){
    const f=t.files&&t.files[0];t.value='';if(!f)return;
    try{importData(await f.text(),null)}catch(err){$('#bk-msg').textContent='Não foi possível ler o arquivo.'}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet)closeSheet()});
window.addEventListener('beforeunload',freeUrls);

addEventListener('scroll',()=>{const b=document.getElementById('bar');if(b)b.classList.toggle('stuck',scrollY>6)},{passive:true});
render();
if(!S.setup)openBelt(true);
if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
</script>
</body>
</html>
